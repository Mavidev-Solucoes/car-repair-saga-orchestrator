apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-repair-saga-orchestrator
  labels:
    app.kubernetes.io/name: car-repair-saga-orchestrator
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: car-repair
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: car-repair-saga-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: car-repair-saga-orchestrator
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: car-repair
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: car-repair-saga-orchestrator
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: car-repair-saga-orchestrator-config
          env:
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: newrelic-license
                  key: licenseKey
                  optional: true
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: saga-postgres
                  key: password
            - name: RabbitMq__UserName
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: username
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: password
            # Montada a partir das variáveis acima (o Kubernetes expande $(VAR) declaradas antes).
            - name: ConnectionStrings__PostgreSql
              value: "Host=saga-postgres;Port=5432;Database=car_repair_saga_orchestrator;Username=saga;Password=$(DB_PASSWORD)"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
