# Rotas públicas do serviço no Kong (IngressClass kong, instalada pelo car-repair-k8s-infra).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: car-repair-saga-orchestrator
  labels:
    app.kubernetes.io/name: car-repair-saga-orchestrator
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: car-repair
  annotations:
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /api/sagas
            pathType: Prefix
            backend:
              service:
                name: car-repair-saga-orchestrator
                port:
                  name: http
