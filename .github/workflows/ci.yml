name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  ci:
    name: Restore, Build, Test, Coverage, Sonar and Docker Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_VERSION: 8.0.x
      BUILD_CONFIGURATION: Release
      COVERAGE_THRESHOLD: "80"
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java (SonarScanner requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install ReportGenerator
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Validate SonarCloud secrets
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        run: |
          test -n "$SONAR_TOKEN" || (echo "Missing SONAR_TOKEN secret" && exit 1)
          test -n "$SONAR_PROJECT_KEY" || (echo "Missing SONAR_PROJECT_KEY secret" && exit 1)
          test -n "$SONAR_ORGANIZATION" || (echo "Missing SONAR_ORGANIZATION secret" && exit 1)

      - name: Install SonarScanner
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        run: dotnet tool install --global dotnet-sonarscanner --version 11.3.0

      - name: Restore
        run: dotnet restore CarRepairSagaOrchestrator.sln

      - name: Begin SonarCloud analysis
        id: sonar_begin
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        run: |
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300 \
            /d:sonar.cs.opencover.reportsPaths="TestResults/CoverageReport/OpenCover.xml"

      - name: Build
        run: dotnet build CarRepairSagaOrchestrator.sln --configuration $BUILD_CONFIGURATION --no-restore

      - name: Unit tests with coverage
        run: |
          dotnet test CarRepairSagaOrchestrator.sln \
            --configuration $BUILD_CONFIGURATION \
            --no-build \
            --collect:"XPlat Code Coverage;Format=cobertura" \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory TestResults

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"TestResults/CoverageReport" \
            -reporttypes:"HtmlInline_AzurePipelines;Cobertura;XmlSummary;OpenCover"

      - name: Enforce coverage threshold (80%)
        run: |
          python - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          import os
          import sys

          threshold = float(os.environ["COVERAGE_THRESHOLD"])
          reports = glob.glob("TestResults/**/coverage.cobertura.xml", recursive=True)
          if not reports:
              print("Coverage reports were not generated.")
              sys.exit(1)

          covered = 0
          valid = 0
          for report in reports:
              root = ET.parse(report).getroot()
              lines_covered = root.attrib.get("lines-covered")
              lines_valid = root.attrib.get("lines-valid")
              if lines_covered is None or lines_valid is None:
                  continue
              covered += int(lines_covered)
              valid += int(lines_valid)

          if valid == 0:
              print("Could not read valid line totals from coverage reports.")
              sys.exit(1)

          coverage = (covered / valid) * 100.0
          print(f"Line coverage: {coverage:.2f}%")
          if coverage < threshold:
              print(f"Coverage threshold not met. Required: {threshold:.2f}%, Actual: {coverage:.2f}%")
              sys.exit(1)
          PY

      - name: End SonarCloud analysis (quality gate)
        if: ${{ always() && steps.sonar_begin.outcome == 'success' }}
        run: |
          if [ "${{ job.status }}" = "failure" ]; then
            dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN" || true
          else
            dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
          fi

      - name: Docker build validation
        run: |
          docker build \
            --file src/Api/Dockerfile \
            --tag car-repair-saga-orchestrator:ci-validation \
            .

      - name: Docker startup validation
        run: |
          container_id="$(docker run -d -p 18080:8080 car-repair-saga-orchestrator:ci-validation)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          sleep 10
          if [ "$(docker inspect -f '{{.State.Running}}' "$container_id")" != "true" ]; then
            docker logs "$container_id"
            echo "Container failed to start."
            exit 1
          fi
