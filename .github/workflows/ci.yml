name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  ci:
    name: Restore, Build, Test, Coverage, Sonar and Docker Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_VERSION: 8.0.x
      BUILD_CONFIGURATION: Release
      COVERAGE_THRESHOLD: "80"
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java (SonarScanner requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install SonarScanner and ReportGenerator
        run: |
          dotnet tool update --global dotnet-sonarscanner
          dotnet tool update --global dotnet-reportgenerator-globaltool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore
        run: dotnet restore CarRepairSagaOrchestrator.sln

      - name: Begin SonarCloud analysis
        run: |
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300 \
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"

      - name: Build
        run: dotnet build CarRepairSagaOrchestrator.sln --configuration $BUILD_CONFIGURATION --no-restore

      - name: Unit tests with coverage
        run: |
          dotnet test CarRepairSagaOrchestrator.sln \
            --configuration $BUILD_CONFIGURATION \
            --no-build \
            --collect:"XPlat Code Coverage;Format=opencover,cobertura" \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory TestResults

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"TestResults/CoverageReport" \
            -reporttypes:"HtmlInline_AzurePipelines;Cobertura;XmlSummary"

      - name: Enforce coverage threshold (80%)
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET
          import os

          threshold = float(os.environ["COVERAGE_THRESHOLD"])
          summary = pathlib.Path("TestResults/CoverageReport/Summary.xml")
          if not summary.exists():
              print("Coverage summary file was not generated.")
              sys.exit(1)

          root = ET.parse(summary).getroot()
          linecoverage = root.attrib.get("linecoverage")
          if linecoverage is None:
              print("Could not read line coverage from Summary.xml.")
              sys.exit(1)

          coverage = float(linecoverage)
          print(f"Line coverage: {coverage:.2f}%")
          if coverage < threshold:
              print(f"Coverage threshold not met. Required: {threshold:.2f}%, Actual: {coverage:.2f}%")
              sys.exit(1)
          PY

      - name: End SonarCloud analysis (quality gate)
        if: ${{ always() }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Docker build validation
        run: |
          docker build \
            --file src/Api/Dockerfile \
            --tag car-repair-saga-orchestrator:ci-validation \
            .
